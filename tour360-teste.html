<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Teste 360°</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}
#scene{width:100%;height:100%}
#top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;background:rgba(0,0,0,.55);padding:10px 15px;border-radius:22px;font-size:14px;white-space:nowrap}
#btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:6;border:0;border-radius:28px;padding:14px 20px;background:rgba(0,0,0,.72);color:#fff;font-size:16px}
</style>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
<div id="top">Teste 360° • arraste para olhar ao redor</div>
<button id="btn">🥽 Ativar movimento da cabeça</button>
<a-scene embedded vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: false" renderer="colorManagement: true; antialias: false; precision: mediump">
<a-assets>
<img id="pano" crossorigin="anonymous" src="https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.jpg">
</a-assets>
<a-sky src="#pano" rotation="0 -90 0"></a-sky>
<a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true" wasd-controls-enabled="false"></a-camera>
</a-scene>
<script>
const b=document.getElementById('btn');
b.onclick=async()=>{
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted'){alert('O navegador não autorizou o sensor. No iPhone, permita o acesso aos sensores quando solicitado.');return;}
    }catch(e){alert('Não foi possível solicitar o sensor neste navegador.');return;}
  }
  const c=document.querySelector('a-camera');
  c.setAttribute('look-controls','magicWindowTrackingEnabled: true; touchEnabled: true; enabled: true');
  b.textContent='↩ Movimento ativo';
  document.getElementById('top').textContent='Mova a cabeça/celular para olhar ao redor';
};
</script>
</body>
</html>
