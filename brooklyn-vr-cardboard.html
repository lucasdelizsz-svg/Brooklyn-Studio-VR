<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brooklyn Studio VR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.72);color:#fff;text-align:center}
.card{max-width:340px;padding:24px}
h1{font-size:24px;margin:0 0 10px}
p{font-size:15px;line-height:1.45;margin:8px 0 18px;color:#ddd}
button{border:0;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;background:#fff;color:#111}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 12px;
border-radius:12px;background:rgba(0,0,0,.48);color:#fff;font-size:12px}
#joy{position:absolute;left:22px;bottom:22px;width:112px;height:112px;border-radius:50%;
background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);pointer-events:auto}
#stick{position:absolute;left:31px;top:31px;width:50px;height:50px;border-radius:50%;
background:rgba(255,255,255,.72)}
#exit{position:absolute;right:14px;top:12px;padding:9px 12px;font-size:13px;
background:rgba(0,0,0,.55);color:#fff;pointer-events:auto}
#vrLine{font-size:13px;color:#aaa;margin-top:12px}
</style>
</head>
<body>
<div id="menu">
  <div class="card">
    <h1>Brooklyn Studio VR</h1>
    <p>Coloque o celular no óculos VR. Use o movimento da cabeça para olhar e o joystick para caminhar.</p>
    <button id="enter">ENTRAR NO VR</button>
    <div id="vrLine">Modo Cardboard • visão estereoscópica</div>
  </div>
</div>

<div id="hud">
  <div id="hint">Olhe ao redor e use o joystick para andar</div>
  <button id="exit">SAIR</button>
  <div id="joy"><div id="stick"></div></div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URL =
'https://pub-6366228087a648a1ade223d3b3308418.r2.dev/Brooklyn%20Studio%20C%C3%B3pia.glb';

const menu=document.getElementById('menu');
const enter=document.getElementById('enter');
const hud=document.getElementById('hud');
const joy=document.getElementById('joy');
const stick=document.getElementById('stick');
const exitBtn=document.getElementById('exit');

let scene,camera,renderer,stereo;
let model=null;
let running=false;
let orientationEnabled=false;
let yaw=0,pitch=0;
let touchLookId=null,lastX=0,lastY=0;
let joyId=null;
let joyX=0,joyY=0;
let keys={};
let lastTime=performance.now();
let targetPos=new THREE.Vector3(5.9,1.65,-7.3);
let velocity=new THREE.Vector3();
let deviceQuat=new THREE.Quaternion();
let tempEuler=new THREE.Euler(0,0,0,'YXZ');
let tempQuat=new THREE.Quaternion();

init();

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x050505);

  camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,1000);
  camera.position.copy(targetPos);
  camera.rotation.order='YXZ';

  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  renderer.setScissorTest(true);
  document.body.appendChild(renderer.domElement);

  stereo=new THREE.StereoCamera();
  stereo.eyeSep=0.064;

  const hemi=new THREE.HemisphereLight(0xffffff,0x555555,1.5);
  scene.add(hemi);

  const key=new THREE.DirectionalLight(0xffffff,1.4);
  key.position.set(4,8,2);
  scene.add(key);

  const fill=new THREE.PointLight(0xfff3d0,0.8,12);
  fill.position.set(0,3,0);
  scene.add(fill);

  loadModel();

  enter.addEventListener('click',startVR);
  exitBtn.addEventListener('click',stopVR);
  addEventListener('resize',resize);
  addEventListener('keydown',e=>keys[e.code]=true);
  addEventListener('keyup',e=>keys[e.code]=false);

  // Mouse look for desktop testing.
  renderer.domElement.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'){
      touchLookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    }
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(e.pointerId!==touchLookId)return;
    if(e.pointerType==='mouse'){
      yaw-= (e.clientX-lastX)*0.003;
      pitch-= (e.clientY-lastY)*0.003;
      pitch=THREE.MathUtils.clamp(pitch,-1.35,1.35);
      lastX=e.clientX;lastY=e.clientY;
    }
  });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(e.pointerId===touchLookId)touchLookId=null;
  });

  joy.addEventListener('pointerdown',e=>{
    joyId=e.pointerId;
    joy.setPointerCapture(e.pointerId);
    updateJoy(e);
  });
  joy.addEventListener('pointermove',e=>{
    if(e.pointerId===joyId)updateJoy(e);
  });
  joy.addEventListener('pointerup',endJoy);
  joy.addEventListener('pointercancel',endJoy);

  addEventListener('deviceorientation',onDeviceOrientation,true);

  animate();
}

async function loadModel(){
  const loader=new GLTFLoader();
  try{
    const gltf=await loader.loadAsync(MODEL_URL);
    model=gltf.scene;

    // Mantém a posição usada na versão VR anterior.
    model.position.set(0,0,0);

    model.traverse(o=>{
      if(o.isMesh){
        o.frustumCulled=true;
      }
    });
    scene.add(model);
  }catch(err){
    console.error(err);
  }
}

async function startVR(){
  // Solicita orientação no iOS quando necessário.
  if(typeof DeviceOrientationEvent!=='undefined' &&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    try{
      const permission=await DeviceOrientationEvent.requestPermission();
      orientationEnabled=permission==='granted';
    }catch(e){
      orientationEnabled=false;
    }
  }else{
    orientationEnabled=true;
  }

  // Tenta fullscreen para o uso no óculos.
  try{
    if(document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen();
  }catch(e){}

  try{
    if(screen.orientation && screen.orientation.lock)
      await screen.orientation.lock('landscape');
  }catch(e){}

  running=true;
  menu.style.display='none';
  hud.style.display='block';
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.0));
}

function stopVR(){
  running=false;
  hud.style.display='none';
  menu.style.display='flex';
  try{
    if(document.fullscreenElement)document.exitFullscreen();
  }catch(e){}
}

function onDeviceOrientation(e){
  if(!running || !orientationEnabled)return;

  const alpha=THREE.MathUtils.degToRad(e.alpha||0);
  const beta=THREE.MathUtils.degToRad(e.beta||0);
  const gamma=THREE.MathUtils.degToRad(e.gamma||0);
  const orient=THREE.MathUtils.degToRad(screen.orientation?.angle||0);

  // Conversão padrão de orientação do aparelho para uma câmera Three.js.
  tempEuler.set(beta,alpha,-gamma,'YXZ');
  tempQuat.setFromEuler(tempEuler);

  const q1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
  const q0=new THREE.Quaternion();
  q0.setFromAxisAngle(new THREE.Vector3(0,0,1),-orient);

  deviceQuat.copy(tempQuat).multiply(q1).multiply(q0);
}

function updateCamera(){
  if(orientationEnabled){
    camera.quaternion.copy(deviceQuat);

    // Evita que a inclinação do aparelho faça o jogador "voar".
    const e=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');
    e.x=THREE.MathUtils.clamp(e.x,-1.45,1.45);
    e.z=0;
    camera.quaternion.setFromEuler(e);
  }else{
    camera.rotation.set(pitch,yaw,0,'YXZ');
  }
}

function updateMovement(dt){
  let x=joyX,y=joyY;

  if(keys['KeyW']||keys['ArrowUp'])y-=1;
  if(keys['KeyS']||keys['ArrowDown'])y+=1;
  if(keys['KeyA']||keys['ArrowLeft'])x-=1;
  if(keys['KeyD']||keys['ArrowRight'])x+=1;

  const len=Math.hypot(x,y);
  if(len>1){x/=len;y/=len;}

  // Direção horizontal baseada no azimute da cabeça.
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  if(orientationEnabled){
    const q=camera.quaternion;
    forward.set(0,0,-1).applyQuaternion(q);
    forward.y=0;
    if(forward.lengthSq()>0.001)forward.normalize();
  }
  const right=new THREE.Vector3(forward.z,0,-forward.x);

  const desired=new THREE.Vector3()
    .addScaledVector(forward,-y)
    .addScaledVector(right,x);

  const speed=2.0;
  desired.multiplyScalar(speed);

  velocity.lerp(desired,1-Math.pow(0.001,dt));
  if(len<0.05)velocity.multiplyScalar(Math.pow(0.001,dt));

  camera.position.addScaledVector(velocity,dt);

  // Altura fixa dos olhos.
  camera.position.y=1.65;
}

function updateJoy(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  const max=r.width*0.34;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const d=Math.hypot(dx,dy);
  if(d>max){dx*=max/d;dy*=max/d;}
  joyX=dx/max;
  joyY=dy/max;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
}

function endJoy(e){
  if(e.pointerId!==joyId)return;
  joyId=null;joyX=0;joyY=0;
  stick.style.transform='translate(0,0)';
}

function renderStereo(){
  const w=innerWidth,h=innerHeight;
  renderer.setScissorTest(true);
  renderer.setViewport(0,0,w/2,h);
  renderer.setScissor(0,0,w/2,h);
  renderer.render(scene,stereo.cameraL);

  renderer.setViewport(w/2,0,w/2,h);
  renderer.setScissor(w/2,0,w/2,h);
  renderer.render(scene,stereo.cameraR);

  renderer.setScissorTest(true);
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  if(running){
    updateCamera();
    updateMovement(dt);

    camera.updateMatrixWorld(true);
    stereo.update(camera);
    renderStereo();
  }else{
    renderer.setScissorTest(false);
    renderer.render(scene,camera);
    renderer.setScissorTest(true);
  }
}

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
</script>
</body>
</html>
