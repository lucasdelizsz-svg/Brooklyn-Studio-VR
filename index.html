<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brooklyn Studio VR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000d;color:#fff}
.card{max-width:430px;margin:20px;padding:25px;text-align:center;background:#191919;border-radius:18px}
button{border:0;border-radius:12px;padding:14px 20px;margin:5px;font-size:16px;font-weight:700}
#start{background:#fff}#vr{background:#444;color:#fff}
#joy{display:none;position:fixed;left:22px;bottom:24px;width:118px;height:118px;border-radius:50%;background:#fff2;border:1px solid #fff5;z-index:6;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#fffb}
#vrHelp{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:7;color:#fff;background:#0009;padding:8px 12px;border-radius:10px;font-size:13px;text-align:center;pointer-events:none}
#exitVr{display:none;position:fixed;right:14px;top:14px;z-index:8;background:#0009;color:#fff;border:1px solid #fff5;padding:9px 12px;border-radius:10px}
#loading{font-size:14px;opacity:.9}
</style>
</head>
<body>
<div class="menu" id="menu"><div class="card">
<h1>Brooklyn Studio</h1>
<p id="status">Carregando modelo…</p>
<button id="start">Iniciar exploração</button>
<button id="vr">Entrar em VR Cardboard</button>
<p>Celular: arraste para olhar e use o joystick para caminhar.<br>VR Cardboard: coloque o celular no visor após entrar.</p>
</div></div>
<div id="vrHelp">Modo VR: mova a cabeça para olhar • joystick para caminhar</div>
<button id="exitVr">Sair do VR</button>
<div id="joy"><div id="knob"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

const GLB_URL='https://pub-6366228087a648a1ade223d3b3308418.r2.dev/Brooklyn%20Studio%20C%C3%B3pia.glb';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x151515);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,1000);
camera.position.set(5.9,1.65,-7.3);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance',
  precision:'mediump'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,1.7));
const dl=new THREE.DirectionalLight(0xffffff,1.0);
dl.position.set(5,8,4);
scene.add(dl);

const model=new THREE.Group();
scene.add(model);

const status=document.querySelector('#status');
let modelReady=false;

const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const loader=new GLTFLoader();
loader.load(GLB_URL,g=>{
  model.add(g.scene);
  g.scene.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=true;
      if(o.material){
        o.material.precision='mediump';
      }
    }
  });
  modelReady=true;
  status.textContent='Modelo carregado. Pronto para explorar.';
},xhr=>{
  if(xhr.total){
    status.textContent=`Carregando modelo… ${Math.round(xhr.loaded/xhr.total*100)}%`;
  }
},e=>{
  console.error(e);
  status.textContent='Erro ao carregar o GLB.';
});

let active=false;
let vrMode=false;
let yaw=0,pitch=0,drag=false,lx=0,ly=0;
const keys={};

addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

renderer.domElement.addEventListener('pointerdown',e=>{
  if(vrMode)return;
  drag=true;lx=e.clientX;ly=e.clientY;
});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag||vrMode)return;
  yaw-=(e.clientX-lx)*.004;
  pitch-=(e.clientY-ly)*.003;
  pitch=Math.max(-1.4,Math.min(1.4,pitch));
  lx=e.clientX;ly=e.clientY;
});

/* Joystick */
const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
let jx=0,jy=0,ja=false;
function joystickMove(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y),m=40;
  if(d>m){x=x/d*m;y=y/d*m}
  jx=x/m;jy=y/m;
  knob.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener('pointerdown',e=>{ja=true;joy.setPointerCapture(e.pointerId);joystickMove(e)});
joy.addEventListener('pointermove',e=>{if(ja)joystickMove(e)});
function joystickUp(){ja=false;jx=jy=0;knob.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',joystickUp);
joy.addEventListener('pointercancel',joystickUp);

/* Device orientation for Cardboard */
let deviceOrientationActive=false;
let screenAngle=0;
function getScreenAngle(){
  if(screen.orientation && typeof screen.orientation.angle==='number') return screen.orientation.angle;
  return typeof window.orientation==='number' ? window.orientation : 0;
}
function applyDeviceOrientation(ev){
  if(!vrMode || !ev) return;
  const alpha=THREE.MathUtils.degToRad(ev.alpha||0);
  const beta=THREE.MathUtils.degToRad(ev.beta||0);
  const gamma=THREE.MathUtils.degToRad(ev.gamma||0);
  screenAngle=THREE.MathUtils.degToRad(getScreenAngle());

  const euler=new THREE.Euler();
  const zee=new THREE.Vector3(0,0,1);
  const q0=new THREE.Quaternion();
  const q1=new THREE.Quaternion();

  euler.set(beta,alpha,-gamma,'YXZ');
  const q=new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1.setFromAxisAngle(zee,-screenAngle));

  // Convert device coordinates to the usual camera/world orientation.
  const cameraCorrection=new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(1,0,0),-Math.PI/2
  );
  q.multiply(cameraCorrection);

  camera.quaternion.copy(q);
  deviceOrientationActive=true;
}
function orientationHandler(e){applyDeviceOrientation(e)}

async function enableOrientation(){
  if(typeof DeviceOrientationEvent==='undefined') return false;
  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted') return false;
    }
    addEventListener('deviceorientation',orientationHandler,true);
    return true;
  }catch(e){
    console.warn(e);
    return false;
  }
}

/* Cardboard stereo rendering */
const stereo=new THREE.StereoCamera();
stereo.eyeSep=0.064;

function renderCardboard(){
  const w=renderer.domElement.clientWidth;
  const h=renderer.domElement.clientHeight;
  const halfW=Math.floor(w/2);

  stereo.update(camera);

  renderer.setScissorTest(true);
  renderer.setViewport(0,0,halfW,h);
  renderer.setScissor(0,0,halfW,h);
  renderer.render(scene,stereo.cameraL);

  renderer.setViewport(halfW,0,w-halfW,h);
  renderer.setScissor(halfW,0,w-halfW,h);
  renderer.render(scene,stereo.cameraR);

  renderer.setScissorTest(false);
}

async function enterCardboard(){
  if(!modelReady){
    alert('Aguarde o modelo terminar de carregar.');
    return;
  }

  vrMode=true;
  active=true;
  menu.style.display='none';
  joy.style.display='block';
  document.querySelector('#vrHelp').style.display='block';
  document.querySelector('#exitVr').style.display='block';

  // Better mobile performance in VR.
  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth,innerHeight,false);

  try{
    if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
  }catch(e){}

  try{
    if(screen.orientation?.lock) await screen.orientation.lock('landscape');
  }catch(e){}

  const ok=await enableOrientation();
  if(!ok){
    document.querySelector('#vrHelp').textContent=
      'Sensor de movimento não autorizado. Toque em Sair do VR e permita o movimento do aparelho.';
  }
}

async function exitCardboard(){
  vrMode=false;
  deviceOrientationActive=false;
  document.querySelector('#vrHelp').style.display='none';
  document.querySelector('#exitVr').style.display='none';
  joy.style.display='none';
  if(document.fullscreenElement){
    try{await document.exitFullscreen()}catch(e){}
  }
  if(screen.orientation?.unlock){
    try{screen.orientation.unlock()}catch(e){}
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
  renderer.setSize(innerWidth,innerHeight,false);
}

document.querySelector('#start').onclick=()=>{
  active=true;
  menu.style.display='none';
  joy.style.display='block';
};

document.querySelector('#vr').onclick=enterCardboard;
document.querySelector('#exitVr').onclick=exitCardboard;

addEventListener('orientationchange',()=>{
  if(vrMode) setTimeout(()=>renderer.setSize(innerWidth,innerHeight,false),300);
});

/* Movement: smooth acceleration instead of abrupt joystick movement. */
const velocity=new THREE.Vector2();
const clock=new THREE.Clock();

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);

  if(active){
    if(!vrMode){
      camera.rotation.order='YXZ';
      camera.rotation.y=yaw;
      camera.rotation.x=pitch;
    }

    let x=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx;
    let z=(keys.KeyS?1:0)-(keys.KeyW?1:0)+jy;
    const d=Math.hypot(x,z);

    if(d){
      x/=d;z/=d;
      const target=2.0;
      const smooth=1-Math.exp(-10*dt);
      velocity.x=THREE.MathUtils.lerp(velocity.x,x*target,smooth);
      velocity.y=THREE.MathUtils.lerp(velocity.y,z*target,smooth);

      // Move relative to the current horizontal viewing direction.
      const forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      forward.y=0;forward.normalize();
      const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
      right.y=0;right.normalize();

      camera.position.addScaledVector(right,velocity.x*dt);
      camera.position.addScaledVector(forward,-velocity.y*dt);
    }else{
      const damp=Math.exp(-12*dt);
      velocity.multiplyScalar(damp);
    }

    camera.position.y=1.65;

    if(vrMode) renderCardboard();
    else renderer.render(scene,camera);
  }else{
    renderer.render(scene,camera);
  }
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
});
</script>
</body>
</html>
