<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brooklyn Studio — AR Teste</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000c;color:#fff}
.card{max-width:430px;margin:20px;padding:24px;text-align:center;background:#191919;border-radius:18px}
button{border:0;border-radius:12px;padding:14px 20px;margin:6px;font-size:16px;font-weight:700}
#ar{background:#20b65a;color:#fff}
#ar:disabled{opacity:.55}
#status{font-size:14px;opacity:.9;line-height:1.4}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="menu"><div class="card">
<h1>Brooklyn Studio AR</h1>
<p id="status">Teste de desempenho.</p>
<button id="ar">ENTRAR EM AR</button>
<p>Esta é uma cópia de teste. A versão principal não foi alterada.</p>
</div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const GLB_URL='https://pub-6366228087a648a1ade223d3b3308418.r2.dev/Brooklyn%2520Studio%2520C%25C3%25B3pia%2520-%2520otimizado.glb';
const menu=document.querySelector('#menu'),status=document.querySelector('#status'),arBtn=document.querySelector('#ar');

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance',precision:'mediump'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x666666,1.8));

const model=new THREE.Group();
scene.add(model);
model.position.set(-5.9,0,7.3);

let modelReady=false,loading=false,arSession=false;
const loader=new GLTFLoader();

function loadModel(){
  if(loading||modelReady)return;
  loading=true;
  arBtn.disabled=true;
  status.textContent='Carregando modelo 3D…';
  loader.load(GLB_URL,g=>{
    model.add(g.scene);
    g.scene.traverse(o=>{
      if(o.isMesh){
        o.frustumCulled=true;
        if(o.material)o.material.precision='mediump';
        o.matrixAutoUpdate=false;
      }
    });
    model.updateMatrixWorld(true);
    model.matrixAutoUpdate=false;
    modelReady=true;
    loading=false;
    arBtn.disabled=false;
    status.textContent='Modelo carregado. Toque em ENTRAR EM AR.';
  },xhr=>{
    if(xhr.total)status.textContent=`Carregando modelo 3D… ${Math.round(xhr.loaded/xhr.total*100)}%`;
  },err=>{
    console.error(err);
    loading=false;
    arBtn.disabled=false;
    status.textContent='Erro ao carregar o modelo 3D.';
  });
}

async function enterAR(){
  if(!modelReady){loadModel();return;}
  if(!navigator.xr||!(await navigator.xr.isSessionSupported('immersive-ar'))){
    status.textContent='Este navegador/dispositivo não oferece AR imersivo.';
    return;
  }
  try{
    const session=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['local-floor'],
      optionalFeatures:['hit-test','unbounded']
    });
    await renderer.xr.setSession(session);
    arSession=true;
    menu.style.display='none';
    session.addEventListener('end',()=>{
      arSession=false;
      menu.style.display='flex';
      status.textContent='Sessão encerrada.';
    });
  }catch(e){
    console.error(e);
    status.textContent='Não foi possível iniciar AR: '+e.name;
  }
}

arBtn.addEventListener('click',enterAR);

renderer.setAnimationLoop(()=>{
  if(modelReady||arSession)renderer.render(scene,camera);
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
